<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岩育理赔流程 Demo</title>
<script src="mermaid.min.js"></script>
<style>
/* ========== Reset & Base (GitHub Dark) ========== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:#0d1117;color:#e6edf3;overflow:hidden;height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:#e6edf3}
input,textarea,select{font-family:inherit;font-size:13px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;
  border-radius:6px;padding:6px 10px}
textarea{resize:vertical}

/* ========== 3-Panel Layout ========== */
#app{display:flex;height:100vh;position:relative}

/* Left: Editor */
#left-panel{display:flex;flex-direction:column;border-right:1px solid #21262d;background:#161b22;overflow:hidden;
  width:30%;min-width:0;transition:width .3s ease}
#left-panel.collapsed{width:0 !important;border:none}
#left-panel.collapsed #editor-area,
#left-panel.collapsed .panel-header{display:none}

/* Center: Flowchart */
#center-panel{display:flex;flex-direction:column;background:#0d1117;overflow:hidden;min-width:200px;flex:1}

/* Right: UI Preview — phone 292px * 1.2 = 350px */
#right-panel{display:flex;flex-direction:column;border-left:1px solid #21262d;background:#161b22;overflow:hidden;
  width:350px;flex-shrink:0;min-width:0;transition:all .3s ease}
#right-panel.collapsed{width:0 !important;border:none}
#right-panel.collapsed #ui-preview-area,
#right-panel.collapsed .panel-header{display:none}

/* Dividers */
.divider{width:5px;background:#21262d;cursor:col-resize;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;transition:background .2s;position:relative}
.divider:hover{background:#2f81f7}
.divider::after{content:'⋮';color:#6e7681;font-size:14px}

/* Collapse buttons on dividers */
.collapse-btn{position:absolute;width:14px;height:36px;background:#21262d;border:1px solid #30363d;
  font-size:9px;color:#8b949e;display:flex;align-items:center;justify-content:center;z-index:50;
  transition:all .15s;padding:0;border-radius:4px}
.collapse-btn:hover{background:#30363d;color:#e6edf3}
#collapse-left{left:-14px;top:50%;transform:translateY(-50%);border-right:none;border-radius:4px 0 0 4px}
#collapse-right{right:-14px;top:50%;transform:translateY(-50%);border-left:none;border-radius:0 4px 4px 0}

/* ========== Headers ========== */
.panel-header{height:42px;border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 12px;
  justify-content:space-between;flex-shrink:0;gap:6px}
.panel-header .title{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#8b949e;white-space:nowrap}
.header-btns{display:flex;gap:4px;align-items:center}
.header-btns button{font-size:10px;color:#8b949e;padding:4px 10px;border:1px solid #30363d;border-radius:5px;
  font-weight:600;transition:all .15s}
.header-btns button:hover{background:#21262d;border-color:#8b949e;color:#e6edf3}
.header-btns .btn-primary{background:#238636;color:#fff;border-color:#238636}
.header-btns .btn-primary:hover{background:#2ea043}

/* ========== Editor ========== */
#editor-area{flex:1;display:flex;flex-direction:column;padding:8px;gap:6px;overflow:hidden}
#mermaid-input{flex:1;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:10px;
  font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:11.5px;line-height:1.6;
  tab-size:2;outline:none;resize:none}
#mermaid-input:focus{border-color:#2f81f7;box-shadow:0 0 0 2px rgba(47,129,247,.15)}
#editor-hint{font-size:9px;color:#6e7681;text-align:right}

/* ========== Flowchart Preview ========== */
#preview-area{flex:1;overflow:auto;padding:16px;cursor:grab}
#preview-area.panning{cursor:grabbing;user-select:none}
#mermaid-output{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:24px;
  display:inline-block;min-width:100%}
#mermaid-output svg{height:auto}
#error-msg{color:#ff7b72;font-size:12px;padding:16px;display:none}

/* Zoom */
.zoom-controls{display:flex;align-items:center;gap:3px}
.zoom-controls button{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#8b949e;border:1px solid #30363d;border-radius:5px;background:none;
  transition:all .15s}
.zoom-controls button:hover{background:#21262d;color:#e6edf3;border-color:#8b949e}
.zoom-level{font-size:10px;color:#6e7681;min-width:36px;text-align:center;font-family:monospace}

/* Clickable nodes */
#mermaid-output .node{cursor:pointer}
#mermaid-output .node:hover rect,
#mermaid-output .node:hover polygon{filter:brightness(1.3);transition:filter .15s}

/* Mermaid overrides */
#mermaid-output .nodeLabel{font-family:'PingFang SC','Microsoft YaHei',sans-serif !important;font-size:14px !important;line-height:1.4 !important}
#mermaid-output .edgePath .path{stroke:#4d5566 !important;stroke-width:1.5px !important}
#mermaid-output .edgeLabel{background:#0d1117 !important;color:#8b949e !important;font-size:12px !important}
#mermaid-output .cluster rect{rx:8 !important;ry:8 !important}
#mermaid-output .cluster span{font-size:15px !important;font-weight:600 !important}

/* ========== UI Preview Panel ========== */
#ui-preview-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  padding:16px 12px;background:#0d1117}
#ui-empty{color:#6e7681;font-size:12px;text-align:center;margin-top:40%;line-height:1.8}
#ui-empty .arrow{font-size:20px;margin-bottom:8px;display:block}
.node-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;
  font-size:10px;font-family:monospace;font-weight:600;margin-bottom:12px}

/* ========== Phone Mockup ========== */
.phone-frame{width:280px;height:520px;min-width:280px;background:#fff;border-radius:32px;border:6px solid #1e293b;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);flex-shrink:0}
.phone-nav{height:40px;background:#fff;border-bottom:1px solid #f1f5f9;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 12px 6px;flex-shrink:0}
.phone-nav .page-title{font-size:12px;font-weight:700;color:#1e293b;max-width:140px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.phone-nav .capsule{display:flex;align-items:center;gap:6px;border:1px solid #e2e8f0;border-radius:12px;
  padding:2px 8px;font-size:10px;color:#64748b}
.phone-body{flex:1;overflow-y:auto;background:#f8fafc;padding:0}
.phone-bottom{height:16px;display:flex;justify-content:center;align-items:center;flex-shrink:0;background:#fff}
.phone-bottom div{width:60px;height:4px;background:#e2e8f0;border-radius:4px}

/* Phone page */
.phone-page{padding:16px;min-height:100%;display:flex;flex-direction:column;color:#1e293b}
.phone-page .icon-box{width:32px;height:32px;background:#B20708;border-radius:8px;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:16px;margin-bottom:12px;
  box-shadow:0 4px 6px -1px rgba(178,7,8,.2)}
.phone-page .code-badge{font-size:9px;font-weight:800;background:#f1f5f9;color:#94a3b8;padding:2px 6px;
  border-radius:4px;margin-right:6px}
.phone-page h2{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.phone-page .desc-line{font-size:10px;color:#64748b;line-height:1.6;margin-bottom:2px;display:flex;gap:6px}
.phone-actions{margin-top:auto;padding-top:12px}
.phone-actions .btn{width:100%;padding:10px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;transition:all .15s;color:#fff}
.phone-actions .btn-primary{background:#B20708;color:#fff;box-shadow:0 4px 6px -1px rgba(178,7,8,.2)}
.phone-actions .btn-primary:hover{background:#9a0607}
.phone-actions .btn-secondary{background:#fff;border:1px solid #e2e8f0;color:#475569}
.phone-actions .btn-secondary:hover{background:#f8fafc}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.upload-slot{aspect-ratio:1;background:#f8fafc;border:2px dashed #e2e8f0;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;
  transition:border-color .2s}
.upload-slot:hover{border-color:#fca5a5}
.upload-slot .plus{width:28px;height:28px;background:#fff;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:16px;color:#94a3b8;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:4px}
.upload-slot .name{font-size:8px;font-weight:700;color:#475569}
.upload-slot .note{font-size:7px;color:#94a3b8;margin-top:2px}
.qr-area{margin-top:16px;display:flex;flex-direction:column;align-items:center}
.qr-box{width:120px;height:120px;border:2px solid #f1f5f9;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:11px;color:#64748b;background:#fafafa}
.qr-label{margin-top:8px;font-size:8px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:1px}

/* ========== WeChat ========== */
.wc-phone{display:flex;flex-direction:column;height:100%;background:#f0f0f0}
.wc-topbar{height:40px;background:#3B7DED;display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.wc-back{color:#fff;font-size:16px;opacity:.9}
.wc-topbar-title{color:#fff;font-size:13px;font-weight:600;flex:1;text-align:center;letter-spacing:.3px}
.wc-more{color:#fff;font-size:14px;opacity:.9}
.wc-msgs{flex:1;overflow-y:auto;background:#f0f0f0;padding:10px 8px 10px;display:flex;flex-direction:column;gap:0}
.wc-ts{text-align:center;font-size:9px;color:#999;margin:6px 0 4px}
.wc-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:7px}
.wc-row.right{flex-direction:row-reverse}
.wc-av{width:28px;height:28px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;background:#aaa}
.wc-av.advisor{background:#e64646;letter-spacing:-.5px}
.wc-av.patient{background:#555}
.wc-body{display:flex;flex-direction:column;gap:2px;max-width:170px}
.wc-row.right .wc-body{align-items:flex-end}
.wc-sender{font-size:9px;color:#999;margin-bottom:1px}
.wc-bbl{padding:6px 8px;line-height:1.5;word-break:break-all;font-size:11px;position:relative;white-space:pre-wrap}
.wc-bbl.left{background:#fff;color:#222;border-radius:0 6px 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wc-bbl.left::before{content:'';position:absolute;top:8px;left:-5px;width:0;height:0;
  border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:5px solid #fff}
.wc-bbl.right{background:#7EB8FF;color:#222;border-radius:6px 0 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.10)}
.wc-bbl.right::after{content:'';position:absolute;top:8px;right:-5px;width:0;height:0;
  border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:5px solid #7EB8FF}
.wc-inputbar{height:40px;background:#f6f6f6;border-top:1px solid #e0e0e0;display:flex;align-items:center;
  padding:0 8px;gap:6px;flex-shrink:0}
.wc-input-fake{flex:1;height:26px;background:#fff;border-radius:4px;border:1px solid #ddd}

/* ========== Admin Panel Frame (Backend nodes) ========== */
.admin-frame{width:280px;min-width:280px;background:#1a1a2e;border-radius:12px;border:1px solid #30363d;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 40px -12px rgba(0,0,0,.4);flex-shrink:0}
.admin-topbar{height:36px;background:#16213e;border-bottom:1px solid #30363d;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px;flex-shrink:0}
.admin-logo{font-size:11px;font-weight:700;color:#8957e5;letter-spacing:.5px}
.admin-user{font-size:9px;color:#6e7681;background:#21262d;padding:2px 8px;border-radius:4px}
.admin-body{padding:16px;color:#e6edf3;flex:1;overflow-y:auto}
.admin-body .icon-box{background:#8957e5 !important}
.admin-body .code-badge{background:#21262d;color:#8957e5}
.admin-body h2{color:#e6edf3;font-size:14px}
.admin-body .desc-line{color:#8b949e;font-size:10px;line-height:1.6;margin-bottom:3px}
.admin-body .phone-actions{margin-top:16px}
.admin-body .phone-actions .btn{border-radius:6px;font-size:11px;padding:8px}
.admin-body .phone-actions .btn-primary{background:#8957e5;box-shadow:none}
.admin-body .phone-actions .btn-primary:hover{background:#7c3aed}
.admin-body .phone-actions .btn-secondary{background:#21262d;border:1px solid #30363d;color:#8b949e}

/* ========== Backend card ========== */
.backend-card{padding:16px;text-align:center;color:#1e293b}
.backend-card .bc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:20px;margin:0 auto 10px;color:#fff}
.backend-card h3{font-size:13px;font-weight:700;margin-bottom:6px}
.backend-card p{font-size:10px;color:#64748b;line-height:1.5}
.backend-card .lane-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:16px;
  font-size:9px;font-weight:700;margin-top:10px}
.backend-card .status-box{margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.backend-card .status-box .label{font-size:9px;color:#94a3b8;font-weight:600}
.backend-card .status-box .value{font-size:12px;color:#1e293b;font-weight:700;margin-top:3px}

/* ========== Nav buttons in UI panel ========== */
.ui-nav{display:flex;gap:6px;margin-top:12px;width:280px;justify-content:center}
.ui-nav button{flex:1;padding:6px;font-size:10px;font-weight:600;color:#8b949e;border:1px solid #30363d;
  border-radius:6px;transition:all .15s;background:#161b22}
.ui-nav button:hover{background:#21262d;color:#e6edf3;border-color:#8b949e}
.ui-nav button:disabled{opacity:.3;cursor:default}
</style>
</head>
<body>
<div id="app">
  <!-- Left: Editor -->
  <div id="left-panel" class="collapsed">
    <div class="panel-header">
      <span class="title">Editor</span>
      <div class="header-btns">
        <button class="btn-primary" onclick="renderDiagram()">Render</button>
      </div>
    </div>
    <div id="editor-area">
      <textarea id="mermaid-input" spellcheck="false">flowchart TD
    %% ===== Start Node (above all lanes) =====
    EN01PL[EN01PL 患者扫码进入]

    %% ===== Swim Lanes =====
    %% subgraph EXT [外部]

    %% subgraph PLAT [平台系统]
    IN02PL[IN02PL 项目介绍页]
    RG04PL[RG04PL 注册并登录]
    AP03PL[AP03PL 提交保险与病历资料]
    MT05PL[MT05PL 入组成功\n显示专属管家企微二维码]
    RJ99PL[RJ99PL 审核不通过\n返回首页]
    PV02PL[PV02PL 看板：评估进行中]
    PV03PL[PV03PL 保障条款分析完成\n点击查看]
    RP10PL[RP10PL 查看保障分析报告]
    PV03PL[PV03PL 材料已确认\n理赔申请书编制中]

    %% subgraph WC [企微]
    NF06WC[NF06WC 管家告知\n报告预期时间]
    WC07WC[WC07WC 患者已添加企微]

    %% subgraph BACK [后台]
    MT05BK{MT05BK 后台审查入组资料}
    AU05BK[AU05BK 审查成功]
    WC07CK{WC07CK 患者是否扫码？}
    WC07BK[WC07BK 后台标记待联系]
    EX08BK[EX08BK 专家评估]
    RP11BK[RP11BK 出具保障条款分析报告]

    CT01OF[CT01OF 主动联系患者\n加企业微信]
    CS11WC[CS11WC 企微预约专属解读服务]
    CS12WC[CS12WC 管家告知医疗行为合规要点]
    CS13WC[CS13WC 管家告知各疗程条款对应]
    DC14OF[DC14OF 患者线下决定疗程并付款]
    CF15WC[CF15WC 患者企微告知已决定疗程]
    BK16WC[BK16WC 管家告知回面板点申请理赔指引]

    %% ===== Flow Connections (chronological) =====
    %% Phase 1: 入组
    EN01PL --> IN02PL --> RG04PL --> AP03PL --> MT05BK
    MT05BK -->|审查通过| AU05BK --> MT05PL
    MT05BK -->|审查不通过| RJ99PL
    RJ99PL --> RG04PL
    MT05PL --> WC07CK
    WC07CK -->|已扫码| WC07WC --> NF06WC
    WC07CK -->|未扫码| WC07BK
    WC07BK --> CT01OF
    CT01OF --> NF06WC

    %% Backend review chain (runs in parallel)
    AU05BK --> PV02PL
    EX08BK --> TP09BK --> RP11BK --> RP10PL
    NF06WC --> PV03PL

    %% Phase 1.5: Report completion
    PV03PL --> RP10PL

    %% Phase 1.6: Consultation & Therapy Decision (steps 11-16)
    RP10PL -->|预约专属解读| CS11WC
    CS11WC --> CS12WC
    CS12WC --> CS13WC
    CS13WC --> DC14OF
    DC14OF --> CF15WC
    CF15WC --> BK16WC --> SY16PL[SY16PL 我已支付疗程\n申请理赔指引]

    SY16PL --> GD17WC

    %% Phase 1.7: Upload & Review & Submit (steps 17-21)
    UL17PL --> CK18BK{CK18BK 后台检查\n材料是否合格？}
    CK18BK -->|没问题| LK19PL[LK19PL 确认提交完成\n上传界面锁住]
    LK19PL --> SB20OF[SB20OF 患者线下\n去保司提交理赔]
    SB20OF --> CF21WC[CF21WC 患者企微通知\n已提交理赔材料]
    CF21WC --> BK21WC[BK21WC 管家告知\n回系统点「我已提交」]

    %% Phase 1.8: Follow-up & Review Result (steps 22-27) & Review Result (steps 22-27)
    BK21WC --> FU22PL[FU22PL 系统状态\n理赔跟进中]
    FU22PL --> CK22PL{CK22PL 患者是否已收到\n保司审核结论？}
    CK22PL -->|否| RM23WC
    RM23WC --> FU22PL
    CK22PL -->|是| RC24OF --> CF25WC[CF25WC 患者企微告知\n收到审核结论]
    CF25WC --> BK26WC[BK26WC 管家告知\n回系统上传审核结论]
    BK26WC --> UP27PL[UP27PL 上传审核结论]
    UP27PL --> RV27PL[RV27PL 审核结论已上传\n「我认可并接受」/「我不认可，我要申诉」]

    %% Phase 1.9a: Accept -> follow up payment -> close
    RV27PL -->|我认可并接受| OK01BK[OK01BK 后台标记\n理赔认可]
    OK01BK --> FP01WC[FP01WC 企微协助\n跟进赔付进度]
    FP01WC --> PD01PL[PD01PL 系统状态\n等待保司赔付]
    PD01PL --> OK02WC[OK02WC 患者确认\n已收到理赔款项]
    OK02WC --> ED01PL[ED01PL 项目完成\n理赔成功结案]

    RV27PL -->|我不认可，我要申诉| GD29WC[GD29WC 企微引导\n申诉材料准备] --> AP28PL

    %% Phase 1.9b: Appeal flow (steps 28-32)
    AP28PL --> CK29BK
    CK29BK -->|通过| LK30PL
    CK29BK -->|有问题| GD29WC
    LK30PL --> SB31OF[SB31OF 患者线下\n去保司提交申诉]
    SB31OF --> CF32WC[CF32WC 患者企微通知\n已提交申诉材料]
    CF32WC --> BK32WC[BK32WC 管家告知\n回系统点「我已提交申诉」]

    %% Phase 2a: Appeal follow-up loop (steps 33-38, same as 22-27)
    BK32WC --> FU33PL[FU33PL 系统状态\n申诉跟进中]
    FU33PL --> CK33PL{CK33PL 患者是否已收到\n申诉审核结论？}
    CK33PL -->|否| RM34WC
    RM34WC --> FU33PL
    CK33PL -->|是| RC35OF --> CF36WC[CF36WC 患者企微告知\n收到申诉结论]
    CF36WC --> BK37WC[BK37WC 管家告知\n回系统上传申诉结论]
    BK37WC --> UP38PL[UP38PL 上传申诉结论]
    UP38PL --> RV38PL[RV38PL 申诉结论已上传\n选择后续操作]
    RV38PL -->|我认可并接受| OK01BK
    RV38PL -->|继续申诉| AP28PL
    RV38PL -->|升级外部支持| EX40WC[EX40WC 管家询问\n是否寻求外部资源]

    %% Phase 2b: External support (steps 40-44)
    EX40WC -->|否，继续申诉| AP28PL

<script>
// ========== Lane Detection ==========
const LANE_MAP = {PL:'platform',PA:'platform',WC:'wechat',WA:'wechat',BK:'backend',BA:'backend',CK:'backend',XT:'external',FS:'terminated',OF:'offline'};
const LANE_META = {
  platform:{icon:'📱',label:'平台系统',color:'#2f81f7',bg:'#B20708'},
  wechat:{icon:'💬',label:'企业微信',color:'#2ea043',bg:'#3B7DED'},
  backend:{icon:'⚙️',label:'后台系统',color:'#8957e5',bg:'#8957e5'},
  external:{icon:'🏢',label:'外部机构',color:'#d29922',bg:'#d29922'},
  terminated:{icon:'⛔',label:'服务终止',color:'#da3633',bg:'#da3633'},
  offline:{icon:'📞',label:'线下操作',color:'#a3a300',bg:'#a3a300'}
};
function getNodeLane(id){ const s=id.replace(/^.*?([A-Z]{2})$/,'$1'); return LANE_MAP[s]||'platform'; }
function getNodeText(id){
  const src=document.getElementById('mermaid-input').value;
  const re=new RegExp(id+'[\\[\\{]([^\\]\\}]+)[\\]\\}]');
  const m=src.match(re);
  if(!m) return {heading:id,lines:[]};
  const raw=m[1].replace(/^[A-Z0-9]+ /,'').replace(/\\n/g,'\n');
  const p=raw.split('\n');
  return {heading:p[0],lines:p.slice(1)};
}

// Build ordered node list for prev/next nav
// Graph from mermaid edges: children[A] = [B,C], parents[B] = [A]
let graphChildren={}, graphParents={}, graphEdgeLabels={};
function buildGraph(){
  const src=document.getElementById('mermaid-input').value;
  graphChildren={}; graphParents={}; graphEdgeLabels={};
  const NODE=/[A-Z][A-Z0-9]+(?:PL|PA|WC|WA|BK|BA|CK|XT|FS|OF)/;
  function addEdge(from,to,label){
    if(!graphChildren[from]) graphChildren[from]=[];
    if(!graphParents[to]) graphParents[to]=[];
    if(graphChildren[from].indexOf(to)===-1) graphChildren[from].push(to);
    if(graphParents[to].indexOf(from)===-1) graphParents[to].push(from);
    if(label) graphEdgeLabels[from+'->'+to]=label;
  }
  src.split('\n').forEach(function(line){
    var t=line.trim();
    if(!t||/^(%|subgraph|end$|class |classDef |direction)/.test(t)) return;
    // Strip node definitions: ID[...] or ID{...} -> just ID
    var clean=line.replace(/(\[|\{)[^\]\}]*(\]|\})/g,'');
    // Tokenize: split by --> or -->|label|
    var parts=clean.split(/\s*-->\s*(?:\|([^|]*)\|)?\s*/);
    // parts = [seg0, label0, seg1, label1, seg2, ...]
    // Extract node ID from each segment
    var nodes=[], labels=[];
    for(var i=0;i<parts.length;i++){
      if(i%2===0){
        var m=parts[i].match(NODE);
        nodes.push(m?m[0]:null);
      } else {
        labels.push(parts[i]||'');
      }
    }
    // Create edges between consecutive nodes
    for(var j=0;j<nodes.length-1;j++){
      if(nodes[j]&&nodes[j+1]) addEdge(nodes[j],nodes[j+1],labels[j]||'');
    }
  });
}

let currentNodeId=null;

// ========== Show UI ==========
function showNodeUI(nodeId){
  currentNodeId=nodeId;
  const lane=getNodeLane(nodeId);
  const info=getNodeText(nodeId);
  const meta=LANE_META[lane]||LANE_META.platform;
  const container=document.getElementById('ui-content');
  const empty=document.getElementById('ui-empty');
  const laneLabel=document.getElementById('ui-lane-label');

  laneLabel.textContent=meta.icon+' '+meta.label;
  laneLabel.style.color=meta.color;

  let html='<div class="node-badge" style="background:'+meta.color+'18;color:'+meta.color+';border:1px solid '+meta.color+'44">'+meta.icon+' '+nodeId+'</div>';

  // Custom node UI (data-driven) or generic
  if(CUSTOM_NODES[nodeId]) html+=renderCustom(nodeId);
  else if(lane==='wechat') html+=buildWechatUI(nodeId,info);
  else if(lane==='platform') html+=buildPhoneUI(nodeId,info);
  else html+=buildBackendUI(nodeId,info,lane);

  // Nav buttons from graph edges
  const parents=graphParents[nodeId]||[];
  const children=graphChildren[nodeId]||[];
  html+='<div class="ui-nav" style="flex-direction:column;width:280px">';
  if(parents.length){
    html+='<div style="display:flex;gap:4px;width:100%">';
    parents.forEach(function(p){
      const lbl=graphEdgeLabels[p+'->'+nodeId];
      html+='<button style="flex:1" onclick="showNodeUI(\''+p+'\')">&#9664; '+p+(lbl?' ('+lbl+')':'')+'</button>';
    });
    html+='</div>';
  }
  if(children.length){
    html+='<div style="display:flex;gap:4px;width:100%;flex-wrap:wrap">';
    children.forEach(function(c){
      const lbl=graphEdgeLabels[nodeId+'->'+c];
      html+='<button style="flex:1;min-width:45%" onclick="showNodeUI(\''+c+'\')">'+c+(lbl?' ('+lbl+')':'')+' &#9654;</button>';
    });
    html+='</div>';
  }
  html+='</div>';

  container.innerHTML=html;
  container.style.display='';
  empty.style.display='none';

  // Highlight node in flowchart
  highlightNode(nodeId);

  // Ensure right panel is open
  if(rightCollapsed) toggleRight();
}

// navNode removed — now using direct graph navigation buttons

function highlightNode(nodeId){
  // Remove old highlights
  document.querySelectorAll('#mermaid-output .node-highlighted').forEach(el=>{
    el.classList.remove('node-highlighted');
    const r=el.querySelector('rect,polygon');
    if(r) r.style.filter='';
  });
  // Add new
  const svg=document.querySelector('#mermaid-output svg');
  if(!svg) return;
  const candidates=svg.querySelectorAll('[id^="flowchart-'+nodeId+'-"]');
  candidates.forEach(el=>{
    el.classList.add('node-highlighted');
    const r=el.querySelector('rect,polygon');
    if(r) r.style.filter='brightness(1.5) drop-shadow(0 0 6px rgba(47,129,247,.5))';
    // Scroll the node into view within the preview area
    const previewArea=document.getElementById('preview-area');
    const svgRect=svg.getBoundingClientRect();
    const nodeRect=el.getBoundingClientRect();
    const areaRect=previewArea.getBoundingClientRect();
    const scrollX=nodeRect.left-areaRect.left+previewArea.scrollLeft-areaRect.width/2+nodeRect.width/2;
    const scrollY=nodeRect.top-areaRect.top+previewArea.scrollTop-areaRect.height/2+nodeRect.height/2;
    previewArea.scrollTo({left:Math.max(0,scrollX),top:Math.max(0,scrollY),behavior:'smooth'});
  });
}

// ========== Generic Custom Renderer ==========
function renderCustom(nodeId) {
  const c = CUSTOM_NODES[nodeId];
  if (c.type === 'photo') {
    return '<div style="width:280px;text-align:center">' +
      '<div style="font-size:13px;font-weight:700;color:#e6edf3;margin-bottom:12px">' + c.title + '</div>' +
      '<img src="' + c.img + '" style="width:280px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)">' +
      (c.caption ? '<div style="margin-top:12px;font-size:11px;color:#8b949e;line-height:1.6">' + c.caption + '</div>' : '') +
      '</div>';
  }
  // All other types render inside phone frame
  let body = '';
  // Icon + badge + heading
  body += '<div class="icon-box" style="background:' + (c.iconColor || '#B20708') + '">' + (c.icon || '📋') + '</div>';
  body += '<span class="code-badge">' + nodeId + '</span>';
  body += '<h2>' + c.title + '</h2>';
  // Chat messages (WeChat style)
  if (c.chat) {
    body += '<div style="margin-top:8px">';
    c.chat.forEach(function(msg) {
      var isP = msg.from === 'patient';
      body += '<div class="wc-row ' + (isP ? 'right' : 'left') + '" style="margin-bottom:6px">' +
        '<div class="wc-av ' + (isP ? 'patient' : 'advisor') + '">' + (isP ? '我' : '岩') + '</div>' +
        '<div class="wc-body">' + (isP ? '' : '<div class="wc-sender">岩育理赔顾问</div>') +
        '<div class="wc-bbl ' + (isP ? 'right' : 'left') + '">' + msg.text.replace(/\\n/g,'<br>') + '</div></div></div>';
    });
    body += '</div>';
  }
  // Desc lines
  if (c.desc) c.desc.forEach(function(d) { body += '<div class="desc-line">' + d + '</div>'; });
  // Form fields
  if (c.fields) {
    body += '<div class="form-group">';
    c.fields.forEach(function(f) {
      body += '<div class="form-field"><label>' + f.label + '</label><div class="input-mock">' + f.placeholder + '</div></div>';
    });
    body += '</div>';
  }
  // Upload slots
  if (c.uploads) {
    body += '<div class="upload-grid" style="grid-template-columns:1fr;margin-top:14px">';
    c.uploads.forEach(function(u) {
      body += '<div class="upload-slot" style="aspect-ratio:auto;flex-direction:row;gap:10px;padding:10px 12px;border-radius:10px">' +
        '<div class="plus">+</div><div style="text-align:left"><div class="name" style="font-size:10px">' + u.name + '</div>' +
        '<div class="note" style="font-size:8px;color:#94a3b8;margin-top:2px">' + u.note + '</div></div></div>';
    });
    body += '</div>';
  }
  // QR code
  if (c.qr) {
    body += '<div class="qr-area"><div class="qr-box">QR Code</div>' +
      (c.qrLabel ? '<div class="qr-label">' + c.qrLabel + '</div>' : '') + '</div>';
  }
  // Report sections
  if (c.sections) {
    c.sections.forEach(function(s) {
      body += '<div style="margin-top:12px">';
      body += '<div style="font-size:11px;font-weight:700;color:#1e293b;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #f1f5f9">【' + s.heading + '】</div>';
      s.lines.forEach(function(l) {
        body += '<div style="font-size:9px;color:#475569;line-height:1.6;margin-bottom:2px">' + l + '</div>';
      });
      body += '</div>';
    });
  }
  // Agreement checkbox
  if (c.agreement) {
    body += '<div style="margin-top:14px;padding:10px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:8px">' +
      '<div style="display:flex;align-items:flex-start;gap:6px">' +
      '<div style="width:14px;height:14px;border:1.5px solid #B20708;border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#B20708">\u2713</div>' +
      '<div style="font-size:9px;color:#64748b;line-height:1.5">' + c.agreement + '</div></div></div>';
  }
  // Buttons
  if (c.buttons) {
    body += '<div class="phone-actions">';
    c.buttons.forEach(function(b) {
      body += '<div class="btn ' + (b.primary ? 'btn-primary' : 'btn-secondary') + '" style="justify-content:center">' + b.text + '</div>';
    });
    body += '</div>';
  }
  // Choose frame based on node lane
  var lane = getNodeLane(nodeId);
  if (lane === 'offline') {
    // Offline action card - distinct from all digital interfaces
    return '<div class="admin-frame" style="border-color:#a3a300">' +
      '<div class="admin-topbar" style="background:#2d2d0f"><span class="admin-logo" style="color:#e6e600">📞 线下操作</span><span class="admin-user" style="color:#a3a300">非系统</span></div>' +
      '<div class="admin-body">' + body + '</div></div>';
  }
  if (lane === 'backend') {
    // Dark admin panel style
    return '<div class="admin-frame">' +
      '<div class="admin-topbar"><span class="admin-logo">&#9881; 岩育后台</span><span class="admin-user">管理员</span></div>' +
      '<div class="admin-body">' + body + '</div></div>';
  }
  if (lane === 'wechat') {
    // WeChat chat frame
    return '<div class="phone-frame"><div class="wc-phone">' +
      '<div class="wc-topbar"><span class="wc-back">‹</span><span class="wc-topbar-title">岩育健康理赔顾问</span><span class="wc-more">···</span></div>' +
      '<div class="wc-msgs" style="padding:12px"><div class="phone-page" style="min-height:auto">' + body + '</div></div>' +
      '<div class="wc-inputbar"><span style="font-size:16px;color:#555">🎙</span><div class="wc-input-fake"></div><span style="font-size:16px;color:#555">😊</span><span style="font-size:18px;color:#555">⊕</span></div>' +
      '</div></div>';
  }
  // Default: phone mockup (platform)
  return '<div class="phone-frame"><div class="phone-nav"><span class="page-title">' + c.title +
    '</span><span class="capsule">\u00B7\u00B7\u00B7&nbsp;|&nbsp;\u25CB</span></div>' +
    '<div class="phone-body"><div class="phone-page">' + body + '</div></div>' +
    '<div class="phone-bottom"><div></div></div></div>';
}

// ========== Phone UI ==========
function buildPhoneUI(nodeId,info){
  const all=info.heading+' '+info.lines.join(' ');
  const hasUpload=/提交|上传|材料/.test(all);
  const hasQR=/二维码|扫码/.test(all);
  const hasBtn=/点击|确定|申请|下载|申诉/.test(all);
  const isOK=/成功|已支付/.test(info.heading);
  const isDead=/终止/.test(info.heading);
  const iconColor=isOK?'#238636':isDead?'#da3633':'#B20708';
  const icon=isOK?'✓':isDead?'✕':'📋';

  let c='';
  info.lines.forEach(l=>{ c+='<div class="desc-line">'+l+'</div>'; });
  if(hasQR) c+='<div class="qr-area"><div class="qr-box">QR Code</div></div>';
  if(hasUpload) c+='<div class="upload-grid"><div class="upload-slot"><div class="plus">+</div><div class="name">保单</div></div><div class="upload-slot"><div class="plus">+</div><div class="name">病历</div></div><div class="upload-slot"><div class="plus">+</div><div class="name">发票</div></div><div class="upload-slot"><div class="plus">+</div><div class="name">其他</div></div></div>';

  let btn='';
  if(isOK) btn='<div class="phone-actions"><div class="btn btn-primary" style="background:#238636">查看理赔详情</div></div>';
  else if(isDead) btn='<div class="phone-actions"><div class="btn btn-secondary">返回首页</div></div>';
  else if(hasBtn){ const t=/下载/.test(all)?'下载文件':/申诉/.test(all)?'我要申诉':/确定/.test(all)?'确认提交':'下一步'; btn='<div class="phone-actions"><div class="btn btn-primary">'+t+'</div></div>'; }

  return '<div class="phone-frame"><div class="phone-nav"><span class="page-title">'+info.heading+'</span><span class="capsule">···&nbsp;|&nbsp;○</span></div><div class="phone-body"><div class="phone-page"><div class="icon-box" style="background:'+iconColor+'">'+icon+'</div><span class="code-badge">'+nodeId+'</span><h2>'+info.heading+'</h2>'+c+btn+'</div></div><div class="phone-bottom"><div></div></div></div>';
}

// ========== WeChat UI ==========
function buildWechatUI(nodeId,info){
  const all=info.heading+' '+info.lines.join(' ');
  const msgs=[];
  if(/通知|告知|提醒|推送/.test(all)){
    msgs.push({from:'advisor',text:info.heading});
    info.lines.forEach(l=>msgs.push({from:'advisor',text:l}));
    msgs.push({from:'patient',text:'好的，收到'});
  } else if(/回报|确认/.test(all)){
    msgs.push({from:'patient',text:info.heading});
    info.lines.forEach(l=>msgs.push({from:'patient',text:l}));
    msgs.push({from:'advisor',text:'收到，我们会尽快处理'});
  } else if(/询问/.test(all)){
    msgs.push({from:'advisor',text:info.heading});
    info.lines.forEach(l=>msgs.push({from:'advisor',text:l}));
  } else {
    msgs.push({from:'advisor',text:info.heading});
    info.lines.forEach(l=>msgs.push({from:'advisor',text:l}));
  }

  let chat='<div class="wc-ts">今天 14:00</div>';
  msgs.forEach(m=>{
    const isP=m.from==='patient';
    chat+='<div class="wc-row '+(isP?'right':'left')+'"><div class="wc-av '+(isP?'patient':'advisor')+'">'+(isP?'我':'岩')+'</div><div class="wc-body">'+(isP?'':'<div class="wc-sender">岩育理赔顾问</div>')+'<div class="wc-bbl '+(isP?'right':'left')+'">'+m.text+'</div></div></div>';
  });

  return '<div class="phone-frame"><div class="wc-phone"><div class="wc-topbar"><span class="wc-back">‹</span><span class="wc-topbar-title">岩育健康理赔顾问</span><span class="wc-more">···</span></div><div class="wc-msgs">'+chat+'</div><div class="wc-inputbar"><span style="font-size:16px;color:#555">🎙</span><div class="wc-input-fake"></div><span style="font-size:16px;color:#555">😊</span><span style="font-size:18px;color:#555">⊕</span></div></div></div>';
}

// ========== Mermaid ==========
mermaid.initialize({
  startOnLoad:false, theme:'dark', securityLevel:'loose',
  themeVariables:{
    primaryColor:'#21262d',primaryBorderColor:'#30363d',primaryTextColor:'#e6edf3',
    lineColor:'#4d5566',secondaryColor:'#161b22',tertiaryColor:'#0d1117',
    background:'#0d1117',mainBkg:'#21262d',
    clusterBkg:'rgba(255,255,255,0.03)',clusterBorder:'#21262d',titleColor:'#8b949e',
    fontFamily:"'PingFang SC','Microsoft YaHei',sans-serif",fontSize:'14px'
  },
  flowchart:{curve:'basis',padding:24,useMaxWidth:false,htmlLabels:true}
});

let renderCount=0;
async function renderDiagram(){
  const input=document.getElementById('mermaid-input').value.trim();
  const output=document.getElementById('mermaid-output');
  const err=document.getElementById('error-msg');
  if(!input) return;
  try{
    const id='mmd-'+(++renderCount);
    const {svg}=await mermaid.render(id,input);
    output.innerHTML=svg;
    output.style.display='';
    err.style.display='none';
    applyZoom();
    bindNodeClicks();
    buildGraph();
  }catch(e){
    output.style.display='none';
    err.style.display='block';
    err.textContent=e.message||'Syntax error';
  }
}

function bindNodeClicks(){
  document.querySelectorAll('#mermaid-output .node').forEach(node=>{
    node.addEventListener('click',()=>{
      const m=(node.id||'').match(/flowchart-([A-Za-z0-9_]+)-/);
      if(m) showNodeUI(m[1]);
    });
  });
}

document.getElementById('mermaid-input').addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();renderDiagram();}
});
renderDiagram();

// ========== Collapse ==========
let leftCollapsed=true, rightCollapsed=false;
function toggleLeft(){
  leftCollapsed=!leftCollapsed;
  document.getElementById('left-panel').classList.toggle('collapsed',leftCollapsed);
  document.getElementById('collapse-left').textContent=leftCollapsed?'▶':'◀';
}
function toggleRight(){
  rightCollapsed=!rightCollapsed;
  document.getElementById('right-panel').classList.toggle('collapsed',rightCollapsed);
  document.getElementById('collapse-right').textContent=rightCollapsed?'◀':'▶';
}

// ========== Zoom ==========
let currentZoom=40;
function applyZoom(){
  const svg=document.querySelector('#mermaid-output svg');
  if(svg){svg.style.transform='scale('+(currentZoom/100)+')';svg.style.transformOrigin='top left';}
  document.getElementById('zoom-label').textContent=currentZoom+'%';
}
function zoomIn(){currentZoom=Math.min(300,currentZoom+20);applyZoom();}
function zoomOut(){currentZoom=Math.max(20,currentZoom-20);applyZoom();}
function zoomReset(){currentZoom=100;applyZoom();}

document.getElementById('preview-area').addEventListener('wheel',e=>{
  if(e.ctrlKey){e.preventDefault();e.deltaY<0?zoomIn():zoomOut();}
},{passive:false});

// ========== Pan (mouse drag to scroll) ==========
(function(){
  const area=document.getElementById('preview-area');
  let panning=false,startX,startY,scrollL,scrollT;
  area.addEventListener('mousedown',function(e){
    if(e.target.closest('.node')) return; // don't pan when clicking nodes
    panning=true; area.classList.add('panning');
    startX=e.clientX; startY=e.clientY;
    scrollL=area.scrollLeft; scrollT=area.scrollTop;
  });
  document.addEventListener('mousemove',function(e){
    if(!panning) return;
    area.scrollLeft=scrollL-(e.clientX-startX);
    area.scrollTop=scrollT-(e.clientY-startY);
  });
  document.addEventListener('mouseup',function(){
    panning=false; area.classList.remove('panning');
  });
})();

// ========== Divider Drag ==========
function setupDivider(dividerId,panelId,side){
  const div=document.getElementById(dividerId);
  const panel=document.getElementById(panelId);
  let dragging=false;
  div.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('collapse-btn')) return;
    dragging=true; document.body.style.cursor='col-resize';
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    if(side==='left'){
      const w=e.clientX;
      panel.style.width=Math.max(200,Math.min(window.innerWidth*.5,w))+'px';
      panel.classList.remove('collapsed'); leftCollapsed=false;
      document.getElementById('collapse-left').textContent='◀';
    } else {
      const w=window.innerWidth-e.clientX;
      panel.style.width=Math.max(280,Math.min(window.innerWidth*.5,w))+'px';
      panel.classList.remove('collapsed'); rightCollapsed=false;
      document.getElementById('collapse-right').textContent='▶';
    }
  });
  document.addEventListener('mouseup',()=>{if(dragging){dragging=false;document.body.style.cursor='';}});
}
setupDivider('divider-left','left-panel','left');
setupDivider('divider-right','right-panel','right');

// Arrow keys to navigate nodes when UI panel is focused
document.addEventListener('keydown',e=>{
  // Arrow keys: down = first child, up = first parent
  if(e.key==='ArrowDown'&&currentNodeId){e.preventDefault();const c=(graphChildren[currentNodeId]||[]); if(c.length) showNodeUI(c[0]);}
  if(e.key==='ArrowUp'&&currentNodeId){e.preventDefault();const p=(graphParents[currentNodeId]||[]); if(p.length) showNodeUI(p[0]);}
});
