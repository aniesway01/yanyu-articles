<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理赔流程原型设计器 v2</title>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<style>
/* ========== Reset & Base ========== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:#f8fafc;color:#1e293b;overflow:hidden;height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,textarea,select{font-family:inherit;font-size:13px}

/* ========== Layout ========== */
#app{display:flex;height:100vh;position:relative}
#left-panel{display:flex;flex-direction:column;border-right:1px solid #e2e8f0;background:#fff;overflow:hidden;
  transition:width .3s ease}
#right-panel{transition:width .3s ease,flex .3s ease}
#right-panel.collapsed{flex:0 !important;width:0 !important;min-width:0;overflow:hidden;border:none}
#right-panel{display:flex;flex-direction:column;background:#fff;flex:1;overflow:hidden}
#divider{width:6px;background:#f1f5f9;cursor:col-resize;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:background .2s}
#divider:hover,#divider.dragging{background:#B20708}
#divider::after{content:'⋮';color:#94a3b8;font-size:14px}
#collapse-btn{position:absolute;width:20px;height:40px;background:#fff;border:1px solid #e2e8f0;
  border-radius:4px;font-size:12px;color:#64748b;cursor:pointer;z-index:60;display:flex;
  align-items:center;justify-content:center;padding:0;transition:all .15s}
#collapse-btn:hover{background:#f8fafc;border-color:#B20708;color:#B20708}

/* ========== Headers ========== */
.panel-header{height:48px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;padding:0 16px;
  justify-content:space-between;flex-shrink:0;gap:8px}
.panel-header .title{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;white-space:nowrap}
.panel-header .badge{font-size:11px;font-family:monospace;background:#fef2f2;color:#B20708;padding:2px 10px;
  border-radius:12px}
.header-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.header-btns button{font-size:11px;color:#64748b;padding:4px 10px;border:1px solid #e2e8f0;border-radius:6px;
  font-weight:600;white-space:nowrap;transition:all .15s}
.header-btns button:hover{background:#f8fafc;border-color:#cbd5e1}
.header-btns .btn-danger{color:#ef4444;border-color:#fecaca}
.header-btns .btn-danger:hover{background:#fef2f2}
.save-indicator{font-size:9px;color:#22c55e;font-weight:700;opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}

/* ========== Phone Mockup ========== */
#phone-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#f8fafc;padding:16px}
#phone{width:280px;height:520px;background:#fff;border-radius:32px;border:6px solid #1e293b;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
#phone-nav{height:40px;background:#fff;border-bottom:1px solid #f1f5f9;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 12px 6px;flex-shrink:0}
#phone-nav .page-title{font-size:12px;font-weight:700;color:#1e293b;max-width:140px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#phone-nav .capsule{display:flex;align-items:center;gap:6px;border:1px solid #e2e8f0;border-radius:12px;
  padding:2px 8px;font-size:10px;color:#64748b}
#phone-content{flex:1;overflow-y:auto;background:#f8fafc;padding:0}
#phone-bottom{height:16px;display:flex;justify-content:center;align-items:center;flex-shrink:0}
#phone-bottom div{width:60px;height:4px;background:#e2e8f0;border-radius:4px}
#phone-hint{margin-top:12px;font-size:11px;color:#94a3b8;letter-spacing:1px}

/* Phone content styles */
.phone-page{padding:16px;min-height:100%;display:flex;flex-direction:column}
.phone-page .icon-box{width:32px;height:32px;background:#B20708;border-radius:8px;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:16px;margin-bottom:12px;
  box-shadow:0 4px 6px -1px rgba(178,7,8,.2)}
.phone-page .code-badge{font-size:9px;font-weight:800;background:#f1f5f9;color:#94a3b8;padding:2px 6px;
  border-radius:4px;margin-right:6px}
.phone-page h2{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.phone-page .desc-line{font-size:10px;color:#64748b;line-height:1.6;margin-bottom:2px;display:flex;gap:6px}
.phone-page .desc-line .num{color:#cbd5e1;font-family:monospace;flex-shrink:0}
.phone-page .form-group{margin-top:16px}
.phone-page .form-field{margin-bottom:10px}
.phone-page .form-field label{display:block;font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:4px}
.phone-page .form-field .input-mock{height:32px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:8px;
  padding:0 10px;font-size:10px;color:#cbd5e1;font-style:italic;display:flex;align-items:center}
.phone-page .upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.phone-page .upload-slot{aspect-ratio:1;background:#f8fafc;border:2px dashed #e2e8f0;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;
  transition:border-color .2s}
.phone-page .upload-slot:hover{border-color:#fca5a5}
.phone-page .upload-slot .plus{width:28px;height:28px;background:#fff;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:16px;color:#94a3b8;box-shadow:0 1px 3px rgba(0,0,0,.1);
  margin-bottom:4px}
.phone-page .upload-slot .name{font-size:8px;font-weight:700;color:#475569}
.phone-page .upload-slot .note{font-size:7px;color:#94a3b8;margin-top:2px}
.phone-page .qr-area{margin-top:16px;display:flex;flex-direction:column;align-items:center}
.phone-page .qr-box{width:120px;height:120px;border:2px solid #f1f5f9;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:11px;color:#64748b;background:#fafafa}
.phone-page .qr-label{margin-top:8px;font-size:8px;color:#94a3b8;font-weight:700;text-transform:uppercase;
  letter-spacing:1px}
.phone-actions{margin-top:auto;padding-top:12px}
.phone-actions .btn{width:100%;padding:10px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;transition:all .15s}
.phone-actions .btn-primary{background:#B20708;color:#fff;box-shadow:0 4px 6px -1px rgba(178,7,8,.2)}
.phone-actions .btn-primary:hover{background:#9a0607}
.phone-actions .btn-secondary{background:#fff;border:1px solid #e2e8f0;color:#475569}
.phone-actions .btn-secondary:hover{background:#f8fafc}
.phone-actions .btn .arrow{font-size:14px;opacity:.5}

/* Progress bar */
.progress-bar{padding:10px 16px;background:#fff;border-bottom:1px solid #f8fafc;flex-shrink:0}

/* ========== Flowchart Canvas ========== */
#canvas-container{flex:1;overflow:hidden;position:relative;background:
  radial-gradient(circle,#e2e8f0 1px,transparent 1px);background-size:24px 24px}
#canvas{position:absolute;transform-origin:0 0}
#canvas svg{position:absolute;top:0;left:0;pointer-events:none}

/* Connecting mode overlay */
#canvas-container.connecting{cursor:crosshair}
#canvas-container.connecting .flow-node{cursor:crosshair}
#canvas-container.connecting .flow-node:hover{border-color:#22c55e !important;box-shadow:0 0 0 3px #dcfce7 !important}
#connect-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;
  padding:8px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:100;display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap}
#connect-banner span{color:#4ade80}

/* Flow nodes */
.flow-node{position:absolute;width:180px;padding:12px;background:#fff;border:1px solid #e2e8f0;
  border-radius:12px;cursor:grab;transition:box-shadow .2s,border-color .2s;z-index:10;user-select:none}
.flow-node:hover{border-color:#cbd5e1;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.flow-node.active{border-color:#B20708;box-shadow:0 0 0 3px #fef2f2,0 8px 20px rgba(178,7,8,.1)}
.flow-node.dragging{cursor:grabbing;box-shadow:0 20px 40px rgba(0,0,0,.15);z-index:100;opacity:.9}
.flow-node .node-code{position:absolute;top:-8px;left:-8px;padding:2px 8px;border-radius:10px;
  font-size:9px;font-weight:800;color:#fff;z-index:20}
.flow-node .node-code.active-code{background:#B20708}
.flow-node .node-code.inactive-code{background:#334155}
.flow-node .node-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.flow-node .type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.flow-node .type-label{font-size:9px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.flow-node .node-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-node .node-title.active-title{color:#B20708}
.flow-node .active-dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;background:#B20708;
  border-radius:50%;border:2px solid #fff}
.flow-node .conn-count{position:absolute;bottom:-6px;right:8px;font-size:8px;color:#94a3b8;
  background:#f1f5f9;padding:1px 6px;border-radius:8px}

/* Connection labels on SVG */
.conn-label{font-size:9px;fill:#94a3b8;pointer-events:none;font-weight:600}

/* ========== Context Menu ========== */
#context-menu{position:fixed;background:#fff;border:1px solid #e2e8f0;border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);padding:4px;z-index:1000;min-width:200px;display:none}
#context-menu .menu-item{padding:8px 12px;font-size:12px;border-radius:6px;display:flex;align-items:center;
  gap:8px;color:#475569;transition:all .1s}
#context-menu .menu-item:hover{background:#f8fafc;color:#1e293b}
#context-menu .menu-item.danger:hover{background:#fef2f2;color:#dc2626}
#context-menu .menu-sep{height:1px;background:#f1f5f9;margin:4px 8px}
#context-menu .menu-icon{width:16px;text-align:center;flex-shrink:0}
#context-menu .menu-shortcut{margin-left:auto;font-size:10px;color:#cbd5e1;font-weight:600}

/* ========== Modal ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:2000;display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.modal-header{padding:20px 24px 12px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;
  justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:700}
.modal-header .close-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:16px;color:#94a3b8;transition:all .15s}
.modal-header .close-btn:hover{background:#f1f5f9;color:#1e293b}
.modal-body{padding:16px 24px}
.modal-footer{padding:12px 24px 20px;display:flex;gap:8px;justify-content:flex-end}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.5px}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:8px 12px;border:1px solid #e2e8f0;
  border-radius:8px;font-size:13px;transition:border-color .15s;outline:none}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:#B20708;
  box-shadow:0 0 0 3px rgba(178,7,8,.1)}
.form-row textarea{resize:vertical;min-height:60px}
.modal .btn-save{padding:8px 20px;background:#B20708;color:#fff;border-radius:8px;font-size:13px;
  font-weight:600;transition:background .15s}
.modal .btn-save:hover{background:#9a0607}
.modal .btn-cancel{padding:8px 20px;background:#f1f5f9;color:#64748b;border-radius:8px;font-size:13px;
  font-weight:600;transition:all .15s}
.modal .btn-cancel:hover{background:#e2e8f0;color:#1e293b}

/* Fields editor in modal */
.fields-editor{border:1px solid #f1f5f9;border-radius:8px;padding:8px;margin-top:4px}
.field-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.field-row input{flex:1;padding:6px 8px;font-size:12px}
.field-row .remove-field{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;color:#ef4444;font-size:14px;flex-shrink:0}
.field-row .remove-field:hover{background:#fef2f2}
.add-field-btn{font-size:11px;color:#B20708;font-weight:600;padding:4px 8px;border-radius:6px;
  display:inline-flex;align-items:center;gap:4px}
.add-field-btn:hover{background:#fef2f2}

/* Actions editor in modal */
.action-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.action-row input,.action-row select{flex:1;padding:6px 8px;font-size:12px;min-width:80px}

/* ========== Toolbar ========== */
#canvas-toolbar{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:50}
#canvas-toolbar button{width:36px;height:36px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#64748b;transition:all .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
#canvas-toolbar button:hover{background:#f8fafc;border-color:#cbd5e1;color:#1e293b}

/* Keyboard hints */
#kb-hints{position:absolute;bottom:52px;right:12px;font-size:9px;color:#94a3b8;text-align:right;
  line-height:1.6;z-index:50}
#kb-hints kbd{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:8px;border:1px solid #e2e8f0}

/* Footer */
.panel-footer{height:44px;border-top:1px solid #f1f5f9;padding:0 16px;display:flex;align-items:center;
  gap:16px;flex-shrink:0;background:#fff}
.legend-item{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;color:#64748b;
  text-transform:uppercase;letter-spacing:.5px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.footer-right{margin-left:auto;font-size:10px;color:#94a3b8;font-weight:700}

/* ========== Toast ========== */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
  background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;
  z-index:9999;transition:transform .3s ease;box-shadow:0 10px 25px rgba(0,0,0,.2)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
</style>
</head>
<body>

<div id="app">
  <!-- Left Panel: Phone Mockup -->
  <div id="left-panel" style="width:40%">
    <div class="panel-header">
      <span class="title">WeChat Mini Program Preview</span>
      <span class="badge" id="page-path">pages/home/home</span>
    </div>
    <div id="phone-area">
      <div id="phone">
        <div id="phone-nav">
          <span class="page-title" id="phone-page-title">理赔助手</span>
          <span class="capsule">···&nbsp;|&nbsp;○</span>
        </div>
        <div id="phone-content"></div>
        <div id="phone-bottom"><div></div></div>
      </div>
      <div id="phone-hint">点击按钮模拟小程序跳转</div>
    </div>
  </div>

  <!-- Divider -->
  <div id="divider"><button id="collapse-btn" title="收起/展開流程圖">▶</button></div>

  <!-- Right Panel: Flowchart -->
  <div id="right-panel">
    <div class="panel-header">
      <span class="title">Flow Map</span>
      <div class="header-btns">
        <button id="btn-undo" title="撤销 Ctrl+Z">↩ 撤销</button>
        <button id="btn-redo" title="重做 Ctrl+Y">↪ 重做</button>
        <span class="save-indicator" id="save-ind">已保存</span>
        <button id="btn-export" title="匯出 JSON">📤 匯出</button>
        <button id="btn-import" title="匯入 JSON">📥 匯入</button>
        <button id="btn-reset" class="btn-danger" title="重置為預設">🔄 重置</button>
      </div>
    </div>
    <div id="canvas-container">
      <div id="connect-banner">点击目标节点完成连线 · <span>ESC 取消</span></div>
      <div id="canvas-toolbar">
        <button id="btn-auto-layout" title="自动排列" style="width:auto;padding:0 10px;font-size:11px;font-weight:700">⚡排列</button>
        <button id="btn-zoom-in" title="放大">＋</button>
        <button id="btn-zoom-out" title="缩小">−</button>
        <button id="btn-zoom-fit" title="适应">⊞</button>
      </div>
      <div id="kb-hints">
        <kbd>双击</kbd> 编辑 · <kbd>右键</kbd> 菜单 · <kbd>Del</kbd> 删除<br>
        <kbd>Ctrl+Z</kbd> 撤销 · <kbd>Ctrl+Y</kbd> 重做 · <kbd>滚轮</kbd> 缩放
      </div>
      <div id="canvas">
        <svg id="canvas-svg"></svg>
      </div>
    </div>
    <div class="panel-footer">
      <div class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> Page</div>
      <div class="legend-item"><span class="legend-dot" style="background:#a78bfa"></span> Modal</div>
      <div class="legend-item"><span class="legend-dot" style="background:#4ade80"></span> Action</div>
      <div class="legend-item"><span class="legend-dot" style="background:#fb923c"></span> Form</div>
      <div class="legend-item"><span class="legend-dot" style="background:#38bdf8"></span> Upload</div>
      <span class="footer-right">Prototyper v2.0</span>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div id="context-menu">
  <div class="menu-item" data-action="add-node"><span class="menu-icon">➕</span> 新增节点</div>
  <div class="menu-item" data-action="edit-node" id="ctx-edit" style="display:none"><span class="menu-icon">✏️</span> 编辑节点 <span class="menu-shortcut">双击</span></div>
  <div class="menu-item" data-action="duplicate-node" id="ctx-dup" style="display:none"><span class="menu-icon">📋</span> 复制节点</div>
  <div class="menu-sep" id="ctx-sep1" style="display:none"></div>
  <div class="menu-item" data-action="add-connection" id="ctx-conn" style="display:none"><span class="menu-icon">🔗</span> 从此节点连线</div>
  <div class="menu-item" data-action="manage-connections" id="ctx-manage" style="display:none"><span class="menu-icon">📐</span> 管理连线</div>
  <div class="menu-sep" id="ctx-sep2" style="display:none"></div>
  <div class="menu-item danger" data-action="delete-node" id="ctx-del" style="display:none"><span class="menu-icon">🗑️</span> 删除节点 <span class="menu-shortcut">Del</span></div>
</div>

<!-- Modal container -->
<div id="modal-container"></div>

<!-- Toast -->
<div id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script>
// ============================================================
//  SECURITY: Proper escaping for all contexts
// ============================================================
const _escDiv = document.createElement('div');
function escHtml(s) {
  _escDiv.textContent = String(s || '');
  return _escDiv.innerHTML;
}
function escAttr(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
//  DEFAULT FLOW DATA
// ============================================================
const DEFAULT_FLOW = [
  {id:'home',code:'ST01',title:'欢迎页 (Start)',type:'page',
    content:{heading:'岩育健康理赔助手',
      text:'1. 您好！我们是岩育健康的理赔协助团队。\n2. 整个申请大约需要 5-10 分钟，我们会一步步引导您。\n3. 如果暂时没有准备好全部材料也没关系，可以先了解流程。\n4. 遇到困难随时点击右下角联系顾问。',
      actions:[{label:'开始理赔申请',targetId:'terms_agreement',variant:'primary'}]},
    position:{x:40,y:40}},

let claimType = 'outpatient'; // set when user picks at TY04

// Undo/Redo stacks
const undoStack = [];
const redoStack = [];
const MAX_UNDO = 50;

// ============================================================
//  PERSISTENCE & UNDO/REDO
// ============================================================
function loadFlow() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed) && parsed.length) return parsed; }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_FLOW));
}

function saveFlow() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(flow));
  showSaveIndicator();
}

function pushUndo() {
  undoStack.push(JSON.stringify(flow));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;  // clear redo on new action
  updateUndoButtons();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(flow));
  flow = JSON.parse(undoStack.pop());
  saveFlow();
  if (!flow.find(n => n.id === currentId)) currentId = flow[0]?.id || 'home';
  renderAll();
  updateUndoButtons();
  toast('已撤销');
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(flow));
  flow = JSON.parse(redoStack.pop());
  saveFlow();
  if (!flow.find(n => n.id === currentId)) currentId = flow[0]?.id || 'home';
  renderAll();
  updateUndoButtons();
  toast('已重做');
}

function updateUndoButtons() {
  $('btn-undo').style.opacity = undoStack.length ? '1' : '0.4';
  $('btn-redo').style.opacity = redoStack.length ? '1' : '0.4';
}

function showSaveIndicator() {
  const el = $('save-ind');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

function navigateTo(id) {
  if (!flow.find(n => n.id === id)) return;
  // Detect claim type from TY04 checklist selection
  const typeMap = {claim_checklist_outpatient:'outpatient',claim_checklist_inpatient:'inpatient',
    claim_checklist_allowance:'allowance',claim_checklist_critical:'critical',
    claim_checklist_disability:'disability',claim_checklist_death:'death'};
  if (typeMap[id]) claimType = typeMap[id];
  // Detect path choice at CI02
  if (id === 'guardian_info_input') claimPath = 'guardian';
  if (id === 'contact_info_input' && currentId === 'insured_info_input') claimPath = 'self';
  // Reset path when starting over
  if (id === 'home') { claimPath = 'self'; claimType = 'outpatient'; }
  currentId = id;
  selectedNodeId = id;
  renderPhone();
  renderFlowNodes();
  renderConnections();
}

function updateCanvasTransform() {
  canvas.style.transform = 'translate(' + canvasX + 'px,' + canvasY + 'px) scale(' + canvasScale + ')';
}

function renderFlowNodes() {
  canvas.querySelectorAll('.flow-node').forEach(el => el.remove());

  flow.forEach(node => {
    const isActive = node.id === currentId;
    const isSelected = node.id === selectedNodeId;
    const el = document.createElement('div');
    el.className = 'flow-node' + (isActive ? ' active' : '');
    el.dataset.nodeId = node.id;
    el.style.left = node.position.x + 'px';
    el.style.top = node.position.y + 'px';

    const typeColor = TYPE_COLORS[node.type] || '#94a3b8';

    // Build node content safely
    const codeEl = document.createElement('div');
    codeEl.className = 'node-code ' + (isActive ? 'active-code' : 'inactive-code');
    codeEl.textContent = node.code;
    el.appendChild(codeEl);

    if (isActive) {
      const dot = document.createElement('div');
      dot.className = 'active-dot';
      el.appendChild(dot);
    }

    const header = document.createElement('div');
    header.className = 'node-header';
    const left = document.createElement('div');
    left.style.cssText = 'display:flex;align-items:center;gap:6px';
    const typeDot = document.createElement('span');
    typeDot.className = 'type-dot';
    typeDot.style.background = typeColor;
    left.appendChild(typeDot);
    const typeLabel = document.createElement('span');
    typeLabel.className = 'type-label';
    typeLabel.textContent = node.type;
    left.appendChild(typeLabel);
    header.appendChild(left);
    el.appendChild(header);

    const title = document.createElement('div');
    title.className = 'node-title' + (isActive ? ' active-title' : '');
    title.textContent = node.title;
    el.appendChild(title);

    // Connection count badge
    const connCount = node.content.actions.filter(a => a.targetId).length;
    if (connCount > 0) {
      const badge = document.createElement('div');
      badge.className = 'conn-count';
      badge.textContent = connCount + ' conn';
      el.appendChild(badge);
    }

    // Click to navigate (skip if just finished dragging)
    el.addEventListener('click', (e) => {
      if (justDragged) { justDragged = false; return; }
      if (connectingFromId) { addConnectionTo(node.id); return; }
      selectedNodeId = node.id;
      navigateTo(node.id);
    });

    // Double-click to edit
    el.addEventListener('dblclick', (e) => {
      e.preventDefault();
      e.stopPropagation();
      openNodeEditor(node.id);
    });

    // Drag
    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (connectingFromId) return;
      dragNode = node;
      dragMoved = false;
      const rect = el.getBoundingClientRect();
      dragOffX = e.clientX - rect.left;
      dragOffY = e.clientY - rect.top;
      el.classList.add('dragging');
      selectedNodeId = node.id;
      e.stopPropagation();
    });

    // Right click
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      selectedNodeId = node.id;
      showContextMenu(e.clientX, e.clientY, node.id);
    });

    canvas.appendChild(el);
  });
}

function renderConnections() {
  let maxX = 0, maxY = 0;
  flow.forEach(n => {
    maxX = Math.max(maxX, n.position.x + 300);
    maxY = Math.max(maxY, n.position.y + 200);
  });
  canvasSvg.setAttribute('width', maxX);
  canvasSvg.setAttribute('height', maxY);
  canvasSvg.style.width = maxX + 'px';
  canvasSvg.style.height = maxY + 'px';

  let svgContent = '<defs>' +
    '<marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#cbd5e1"/></marker>' +
    '<marker id="ah-active" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#B20708"/></marker>' +
    '</defs>';

  flow.forEach(node => {
    node.content.actions.forEach((action, idx) => {
      const target = flow.find(n => n.id === action.targetId);
      if (!target) return;

      const isActive = node.id === currentId;
      const x1 = node.position.x + 90, y1 = node.position.y + 40;
      const x2 = target.position.x + 90, y2 = target.position.y + 10;
      const isReturn = x2 < x1;
      const cy = (y1 + y2) / 2 - (isReturn ? 80 : 15);
      const cx = (x1 + x2) / 2;

      const pathId = 'path-' + node.id + '-' + idx;
      svgContent += '<path id="' + pathId + '" d="M ' + x1 + ' ' + y1 + ' Q ' + cx + ' ' + cy + ' ' + x2 + ' ' + y2 + '" fill="none"' +
        ' stroke="' + (isActive ? '#B20708' : '#cbd5e1') + '" stroke-width="' + (isActive ? 2.5 : 1.5) + '"' +
        (isActive ? '' : ' stroke-dasharray="4 4"') +
        ' marker-end="url(#' + (isActive ? 'ah-active' : 'ah') + ')"/>';

      const labelX = cx, labelY = cy - 4;
      svgContent += '<text x="' + labelX + '" y="' + labelY + '" class="conn-label" text-anchor="middle">' + escHtml(action.label) + '</text>';
    });
  });

  canvasSvg.innerHTML = svgContent;
}

// ============================================================
//  CANVAS PAN & ZOOM
// ============================================================
canvasContainer.addEventListener('mousedown', (e) => {
  if (e.button === 1 || (e.button === 0 && !e.target.closest('.flow-node'))) {
    isPanning = true;
    panStartX = e.clientX - canvasX;
    panStartY = e.clientY - canvasY;
    canvasContainer.style.cursor = 'grabbing';
    e.preventDefault();
  }
});

document.addEventListener('mousemove', (e) => {
  if (isPanning) {
    canvasX = e.clientX - panStartX;
    canvasY = e.clientY - panStartY;
    updateCanvasTransform();
  }
  if (dragNode) {
    dragMoved = true;
    const rect = canvasContainer.getBoundingClientRect();
    const nx = (e.clientX - rect.left - canvasX - dragOffX) / canvasScale;
    const ny = (e.clientY - rect.top - canvasY - dragOffY) / canvasScale;
    dragNode.position.x = Math.round(Math.max(0, nx));
    dragNode.position.y = Math.round(Math.max(0, ny));
    const el = canvas.querySelector('[data-node-id="' + dragNode.id + '"]');
    if (el) { el.style.left = dragNode.position.x + 'px'; el.style.top = dragNode.position.y + 'px'; }
    renderConnections();
  }
});

document.addEventListener('mouseup', () => {
  if (isPanning) { isPanning = false; canvasContainer.style.cursor = ''; }
  if (dragNode) {
    const el = canvas.querySelector('[data-node-id="' + dragNode.id + '"]');
    if (el) el.classList.remove('dragging');
    if (dragMoved) justDragged = true;  // only prevent click if actually moved
    if (dragMoved) pushUndo();
    dragNode = null;
    saveFlow();
  }
});

canvasContainer.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.05 : 0.05;
  const newScale = Math.min(2, Math.max(0.2, canvasScale + delta));
  const rect = canvasContainer.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  canvasX = mx - (mx - canvasX) * (newScale / canvasScale);
  canvasY = my - (my - canvasY) * (newScale / canvasScale);
  canvasScale = newScale;
  updateCanvasTransform();
}, {passive: false});

$('btn-zoom-in').addEventListener('click', () => { canvasScale = Math.min(2, canvasScale + 0.1); updateCanvasTransform(); });
$('btn-zoom-out').addEventListener('click', () => { canvasScale = Math.max(0.2, canvasScale - 0.1); updateCanvasTransform(); });
$('btn-zoom-fit').addEventListener('click', fitCanvas);

function fitCanvas() {
  if (!flow.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  flow.forEach(n => {
    minX = Math.min(minX, n.position.x);
    minY = Math.min(minY, n.position.y);
    maxX = Math.max(maxX, n.position.x + 180);
    maxY = Math.max(maxY, n.position.y + 80);
  });
  const rect = canvasContainer.getBoundingClientRect();
  const fw = maxX - minX + 100, fh = maxY - minY + 100;
  canvasScale = Math.min(rect.width / fw, rect.height / fh, 1);
  canvasX = (rect.width - fw * canvasScale) / 2 - minX * canvasScale + 50 * canvasScale;
  canvasY = (rect.height - fh * canvasScale) / 2 - minY * canvasScale + 50 * canvasScale;
  updateCanvasTransform();
}

// ============================================================
//  AUTO LAYOUT (Dagre hierarchical + snake fallback)
// ============================================================
function autoLayoutDagre() {
  // Step 1: Use Dagre to compute topological rank (layer) for each node
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'TB', nodesep: 30, ranksep: 50, marginx: 0, marginy: 0 });
  g.setDefaultEdgeLabel(function() { return {}; });

  flow.forEach(n => g.setNode(n.id, { width: 180, height: 70 }));
  flow.forEach(n => {
    n.content.actions.forEach(a => {
      if (a.targetId && flow.some(t => t.id === a.targetId)) {
        g.setEdge(n.id, a.targetId);
      }
    });
  });
  dagre.layout(g);

  // Step 2: Extract rank (y-layer) from Dagre, group nodes by rank
  const nodeRanks = [];
  g.nodes().forEach(id => {
    const pos = g.node(id);
    if (pos) nodeRanks.push({ id, rank: pos.y, dagreX: pos.x });
  });
  // Sort by rank (y), then by dagreX within same rank
  nodeRanks.sort((a, b) => a.rank - b.rank || a.dagreX - b.dagreX);

  // Group by rank
  const layers = [];
  let lastRank = -Infinity;
  nodeRanks.forEach(nr => {
    if (nr.rank - lastRank > 10) { layers.push([]); lastRank = nr.rank; }
    layers[layers.length - 1].push(nr.id);
  });

  // Step 3: Pack layers into a compact grid
  // Flatten layers into a sequential order, then lay out in snake pattern
  const COLS = Math.max(3, Math.min(5, Math.ceil(Math.sqrt(flow.length * 1.5))));
  const CELL_W = 230;
  const CELL_H = 140;
  const PAD = 30;

  // Flatten: walk layers in order, keeping Dagre's topological sort
  const ordered = [];
  layers.forEach(layer => layer.forEach(id => ordered.push(id)));
  // Add any nodes not in Dagre output
  flow.forEach(n => { if (!ordered.includes(n.id)) ordered.push(n.id); });

  // Snake layout with Dagre's ordering
  ordered.forEach((id, i) => {
    const node = flow.find(n => n.id === id);
    if (!node) return;
    const row = Math.floor(i / COLS);
    const colInRow = i % COLS;
    const col = row % 2 === 0 ? colInRow : (COLS - 1 - colInRow);
    node.position.x = PAD + col * CELL_W;
    node.position.y = PAD + row * CELL_H;
  });
}

function autoLayoutSnake() {
  // Fallback: BFS + snake (when Dagre CDN not loaded)
  const startId = flow.find(n => n.id === 'home') ? 'home' : flow[0].id;
  const visited = new Set();
  const order = [];
  const queue = [startId];
  visited.add(startId);
  while (queue.length) {
    const id = queue.shift();
    const node = flow.find(n => n.id === id);
    if (!node) continue;
    order.push(node);
    node.content.actions.forEach(a => {
      if (a.targetId && !visited.has(a.targetId)) {
        visited.add(a.targetId);
        queue.push(a.targetId);
      }
    });
  }
  flow.forEach(n => { if (!visited.has(n.id)) order.push(n); });

  const COLS = 4, CELL_W = 230, CELL_H = 150, PAD = 40;
  order.forEach((node, i) => {
    const row = Math.floor(i / COLS);
    const col = i % COLS;
    const c = row % 2 === 0 ? col : (COLS - 1 - col);
    node.position.x = PAD + c * CELL_W;
    node.position.y = PAD + row * CELL_H;
  });
}

function autoLayout() {
  if (!flow.length) return;
  pushUndo();

  if (typeof dagre !== 'undefined' && dagre.graphlib) {
    autoLayoutDagre();
    toast('已排列 (Dagre 分层算法, ' + flow.length + ' 节点)');
  } else {
    autoLayoutSnake();
    toast('已排列 (蛇形排列, 离线模式)');
  }

  saveFlow();
  renderAll();
  fitCanvas();
}

$('btn-auto-layout').addEventListener('click', autoLayout);

canvasContainer.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const nodeEl = e.target.closest('.flow-node');
  const nodeId = nodeEl ? nodeEl.dataset.nodeId : null;
  const rect = canvasContainer.getBoundingClientRect();
  ctxClickX = Math.round((e.clientX - rect.left - canvasX) / canvasScale);
  ctxClickY = Math.round((e.clientY - rect.top - canvasY) / canvasScale);
  showContextMenu(e.clientX, e.clientY, nodeId);
});

function showContextMenu(x, y, nodeId) {
  ctxTargetNodeId = nodeId;
  const has = !!nodeId;
  const node = has ? flow.find(n => n.id === nodeId) : null;
  const hasConns = node ? node.content.actions.some(a => a.targetId) : false;
  $('ctx-edit').style.display = has ? '' : 'none';
  $('ctx-dup').style.display = has ? '' : 'none';
  $('ctx-conn').style.display = has ? '' : 'none';
  $('ctx-manage').style.display = has && hasConns ? '' : 'none';
  $('ctx-del').style.display = has ? '' : 'none';
  $('ctx-sep1').style.display = has ? '' : 'none';
  $('ctx-sep2').style.display = has ? '' : 'none';
  contextMenu.style.display = 'block';
  contextMenu.style.left = Math.min(x, window.innerWidth - 220) + 'px';
  contextMenu.style.top = Math.min(y, window.innerHeight - 280) + 'px';
}

document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

contextMenu.addEventListener('click', (e) => {
  const item = e.target.closest('.menu-item');
  if (!item) return;
  contextMenu.style.display = 'none';
  switch(item.dataset.action) {
    case 'add-node': openNodeEditor(null); break;
    case 'edit-node': openNodeEditor(ctxTargetNodeId); break;
    case 'duplicate-node': duplicateNode(ctxTargetNodeId); break;
    case 'add-connection': startConnection(ctxTargetNodeId); break;
    case 'manage-connections': openConnectionManager(ctxTargetNodeId); break;
    case 'delete-node': deleteNode(ctxTargetNodeId); break;
  }
});

// ============================================================
//  NODE OPERATIONS
// ============================================================
function generateId() { return 'node_' + Date.now().toString(36) + Math.random().toString(36).substr(2,4); }

function generateCode() {
  const existing = new Set(flow.map(n => n.code));
  for (let i = 1; i < 999; i++) {
    const code = 'ND' + String(i).padStart(2,'0');
    if (!existing.has(code)) return code;
  }
  return 'ND99';
}

function duplicateNode(nodeId) {
  const src = flow.find(n => n.id === nodeId);
  if (!src) return;
  pushUndo();
  const n = JSON.parse(JSON.stringify(src));
  n.id = generateId();
  n.code = generateCode();
  n.title = src.title + ' (副本)';
  n.position = { x: src.position.x + 30, y: src.position.y + 30 };
  flow.push(n);
  saveFlow();
  renderAll();
  toast('节点已复制');
}

function deleteNode(nodeId) {
  if (!nodeId) return;
  if (nodeId === 'home') { toast('首页节点不能删除'); return; }
  if (!confirm('确定删除节点 "' + (flow.find(n=>n.id===nodeId)?.title||nodeId) + '"？\n所有指向它的连线也会被移除。')) return;
  pushUndo();
  flow.forEach(n => { n.content.actions = n.content.actions.filter(a => a.targetId !== nodeId); });
  flow = flow.filter(n => n.id !== nodeId);
  if (currentId === nodeId) currentId = 'home';
  if (selectedNodeId === nodeId) selectedNodeId = null;
  saveFlow();
  renderAll();
  toast('节点已删除');
}

// ============================================================
//  CONNECTION MODE
// ============================================================
function startConnection(fromId) {
  connectingFromId = fromId;
  canvasContainer.classList.add('connecting');
  connectBanner.style.display = 'block';
}

function addConnectionTo(toId) {
  if (!connectingFromId || connectingFromId === toId) { cancelConnection(); return; }
  const fromNode = flow.find(n => n.id === connectingFromId);
  if (!fromNode) { cancelConnection(); return; }
  if (fromNode.content.actions.some(a => a.targetId === toId)) {
    toast('连线已存在');
    cancelConnection();
    return;
  }
  pushUndo();
  const targetNode = flow.find(n => n.id === toId);
  fromNode.content.actions.push({
    label: '前往 ' + (targetNode ? targetNode.content.heading : toId),
    targetId: toId,
    variant: 'primary'
  });
  saveFlow();
  cancelConnection();
  renderAll();
  toast('连线已添加');
}

function cancelConnection() {
  connectingFromId = null;
  canvasContainer.classList.remove('connecting');
  connectBanner.style.display = 'none';
}

function openConnectionManager(nodeId) {
  const node = flow.find(n => n.id === nodeId);
  if (!node) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.addEventListener('click', (e) => { if (e.target === overlay) { modalContainer.innerHTML = ''; } });

  const modal = document.createElement('div');
  modal.className = 'modal';

  const header = document.createElement('div');
  header.className = 'modal-header';
  const h3 = document.createElement('h3');
  h3.textContent = '管理连线 — ' + node.title;
  header.appendChild(h3);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'close-btn';
  closeBtn.textContent = '✕';
  closeBtn.addEventListener('click', () => { modalContainer.innerHTML = ''; });
  header.appendChild(closeBtn);
  modal.appendChild(header);

  const body = document.createElement('div');
  body.className = 'modal-body';

  if (!node.content.actions.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:#94a3b8;font-size:13px;padding:20px;text-align:center';
    empty.textContent = '此节点没有任何连线';
    body.appendChild(empty);
  } else {
    node.content.actions.forEach((action, i) => {
      const target = flow.find(n => n.id === action.targetId);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #f1f5f9;border-radius:8px;margin-bottom:8px';

      const info = document.createElement('div');
      info.style.cssText = 'flex:1';
      const label = document.createElement('div');
      label.style.cssText = 'font-size:13px;font-weight:600;color:#1e293b';
      label.textContent = action.label;
      info.appendChild(label);
      const targetInfo = document.createElement('div');
      targetInfo.style.cssText = 'font-size:11px;color:#94a3b8;margin-top:2px';
      targetInfo.textContent = '→ ' + (target ? target.code + ' ' + target.title : '(不存在: ' + action.targetId + ')');
      info.appendChild(targetInfo);
      row.appendChild(info);

      const variantBadge = document.createElement('span');
      variantBadge.style.cssText = 'font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;' +
        (action.variant === 'primary' ? 'background:#fef2f2;color:#B20708' : 'background:#f1f5f9;color:#64748b');
      variantBadge.textContent = action.variant || 'primary';
      row.appendChild(variantBadge);

      const delBtn = document.createElement('button');
      delBtn.style.cssText = 'width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#ef4444;font-size:14px';
      delBtn.textContent = '✕';
      delBtn.title = '删除此连线';
      delBtn.addEventListener('mouseenter', () => { delBtn.style.background = '#fef2f2'; });
      delBtn.addEventListener('mouseleave', () => { delBtn.style.background = ''; });
      delBtn.addEventListener('click', () => {
        pushUndo();
        node.content.actions.splice(i, 1);
        saveFlow();
        renderAll();
        // Re-open to refresh
        modalContainer.innerHTML = '';
        if (node.content.actions.length) openConnectionManager(nodeId);
        else toast('所有连线已删除');
      });
      row.appendChild(delBtn);

      body.appendChild(row);
    });
  }

  modal.appendChild(body);
  overlay.appendChild(modal);
  modalContainer.innerHTML = '';
  modalContainer.appendChild(overlay);
}

// ============================================================
let modalData = null;

function openNodeEditor(nodeId) {
  const isNew = !nodeId;
  modalData = isNew ? {
    id: generateId(), code: generateCode(), title: '新节点', type: 'page',
    content: { heading: '新页面', text: '1. 描述内容', fields: [], uploads: [], actions: [], showQR: false },
    position: { x: ctxClickX || 200, y: ctxClickY || 200 }
  } : JSON.parse(JSON.stringify(flow.find(n => n.id === nodeId)));

  if (!modalData) return;
  if (!modalData.content.fields) modalData.content.fields = [];
  if (!modalData.content.uploads) modalData.content.uploads = [];
  if (!modalData.content.actions) modalData.content.actions = [];

  // Render HTML first
  renderNodeEditorModal(isNew);

  // Bind event listeners ONCE on modalContainer (not inside renderNodeEditorModal)
  // Use a wrapper div to swap listeners cleanly
  const mc = modalContainer;

  // Create named handlers so we can reference them
  function onFieldChange(e) {
    const el = e.target;
    if (el.dataset.arr && el.dataset.idx !== undefined && el.dataset.key) {
      const arr = modalData.content[el.dataset.arr];
      if (arr && arr[el.dataset.idx]) arr[el.dataset.idx][el.dataset.key] = el.value;
    }
  }
  function onClick(e) {
    const rmBtn = e.target.closest('[data-remove]');
    if (rmBtn) {
      modalData.content[rmBtn.dataset.remove].splice(parseInt(rmBtn.dataset.idx, 10), 1);
      renderNodeEditorModal(isNew);
      return;
    }
    const addBtn = e.target.closest('[data-add]');
    if (addBtn) {
      const arr = addBtn.dataset.add;
      if (arr === 'fields') modalData.content.fields.push({label:'',placeholder:''});
      else if (arr === 'uploads') modalData.content.uploads.push({label:'',description:''});
      else if (arr === 'actions') modalData.content.actions.push({label:'新按钮',targetId:'',variant:'primary'});
      renderNodeEditorModal(isNew);
    }
  }

  // Remove any previously attached listeners (safety)
  if (mc._edInput) mc.removeEventListener('input', mc._edInput);
  if (mc._edChange) mc.removeEventListener('change', mc._edChange);
  if (mc._edClick) mc.removeEventListener('click', mc._edClick);

  mc.addEventListener('input', onFieldChange);
  mc.addEventListener('change', onFieldChange);
  mc.addEventListener('click', onClick);

  // Store references for cleanup
  mc._edInput = onFieldChange;
  mc._edChange = onFieldChange;
  mc._edClick = onClick;
}

  // Event delegation for modal (overlay/close/save — these are on NEW elements each render, so OK)
  const overlay = $('editor-overlay');
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  $('ed-close').addEventListener('click', closeModal);
  $('ed-cancel').addEventListener('click', closeModal);
  $('ed-save').addEventListener('click', () => saveNodeEditor(isNew));
  // NOTE: input/change/click delegation is bound ONCE in openNodeEditor(), not here
}

function saveNodeEditor(isNew) {
  pushUndo();
  const node = modalData;
  node.code = $('ed-code').value.trim() || node.code;
  node.title = $('ed-title').value.trim() || node.title;
  node.type = $('ed-type').value;
  node.content.heading = $('ed-heading').value.trim() || node.content.heading;
  node.content.text = $('ed-text').value;
  node.content.showQR = $('ed-qr').value === 'true';

  if (isNew) {
    node.id = $('ed-id').value.trim() || node.id;
    if (flow.some(n => n.id === node.id)) { toast('ID 已存在'); return; }
    flow.push(node);
  } else {
    const idx = flow.findIndex(n => n.id === node.id);
    if (idx >= 0) flow[idx] = node;
  }
  node.content.actions = node.content.actions.filter(a => a.label.trim());
  saveFlow();
  closeModal();
  renderAll();
  toast(isNew ? '节点已添加' : '节点已保存');
}

function closeModal() {
  // Clean up delegated listeners
  const mc = modalContainer;
  if (mc._edInput) { mc.removeEventListener('input', mc._edInput); mc._edInput = null; }
  if (mc._edChange) { mc.removeEventListener('change', mc._edChange); mc._edChange = null; }
  if (mc._edClick) { mc.removeEventListener('click', mc._edClick); mc._edClick = null; }
  mc.innerHTML = '';
  modalData = null;
}

document.addEventListener('keydown', (e) => {
  // Don't capture when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

  if (e.key === 'Escape') {
    cancelConnection();
    contextMenu.style.display = 'none';
    if (modalContainer.innerHTML) closeModal();
  }
  if (e.key === 'Delete' && selectedNodeId) {
    deleteNode(selectedNodeId);
  }
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
});

  }
});
document.addEventListener('mouseup', () => { if (divDragging) { divDragging = false; divider.classList.remove('dragging'); } });

// ============================================================
//  COLLAPSE TOGGLE
// ============================================================
const rightPanel = $('right-panel');
const collapseBtn = $('collapse-btn');
let rightCollapsed = false;
let savedLeftWidth = null;
collapseBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (rightCollapsed) {
    rightPanel.classList.remove('collapsed');
    if (savedLeftWidth) leftPanel.style.width = savedLeftWidth;
    collapseBtn.textContent = '▶';
    rightCollapsed = false;
  } else {
    savedLeftWidth = leftPanel.style.width || '40%';
    rightPanel.classList.add('collapsed');
    leftPanel.style.width = '100%';
    collapseBtn.textContent = '◀';
    rightCollapsed = true;
  }
});

// ============================================================
//  EXPORT / IMPORT / RESET
// ============================================================
$('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(flow, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'flow_data_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已匯出 JSON');
});

$('btn-import').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data) || !data[0]?.id) throw new Error('Invalid');
      pushUndo();
      flow = data;
      saveFlow();
      currentId = flow[0]?.id || 'home';
      renderAll();
      fitCanvas();
      toast('已匯入 ' + flow.length + ' 个节点');
    } catch(err) { toast('匯入失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

$('btn-reset').addEventListener('click', () => {
  if (!confirm('确定重置？当前修改将丢失（可用 Ctrl+Z 撤销）。')) return;
  pushUndo();
  flow = JSON.parse(JSON.stringify(DEFAULT_FLOW));
  saveFlow();
  currentId = 'home';
  renderAll();
  fitCanvas();
  toast('已重置');
});

$('btn-undo').addEventListener('click', undo);
$('btn-redo').addEventListener('click', redo);

// ============================================================
//  TOAST
// ============================================================
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============================================================
//  INIT
// ============================================================
function renderAll() {
  renderPhone();
  renderFlowNodes();
  renderConnections();
}

renderAll();
updateUndoButtons();
requestAnimationFrame(fitCanvas);
</script>
</body>
</html>
